<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SEO Doctor | DEC</title>
    <link rel="icon" type="image/png" href="assets/dec-logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="vendor/papaparse.min.js"></script>
    <script defer src="vendor/exceljs.min.js"></script>
    <script defer src="js/pagetype.js"></script>
    <script defer src="js/report.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>
        SEO DOCTOR <span class="divider" aria-hidden="true">|</span>
        <img class="logo" src="assets/dec-logo.png" alt="DEC" />
      </h1>
    </header>

    <div class="layout">
      <nav class="sidebar" aria-label="Tools">
        <button class="tool active" type="button" aria-current="page">Page Type</button>
        <button class="tool" type="button" disabled>Coming soon</button>
        <button class="tool" type="button" disabled>Coming soon</button>
      </nav>

      <main class="panel">
        <section class="step">
          <p>Please upload a valid crawl</p>
          <p class="hint">
            Screaming Frog export (.csv or .xlsx) with at least the columns Address, PLP ID 1,
            PDP ID 1 and GEO Page Type 1. Extra columns are ignored.
          </p>
          <input type="file" id="crawl-file" accept=".csv,.xlsx" hidden />
          <button id="upload-button" class="btn" type="button">Upload</button>
          <span id="file-name" class="file-name"></span>
          <button id="clear-button" class="btn btn-secondary" type="button" hidden>New crawl</button>
          <p id="upload-error" class="error" role="alert" hidden></p>
        </section>

        <section id="result" class="step" hidden>
          <p class="success">Your template is ready</p>
          <p>
            We found <strong id="incorrect-count">0</strong> pages with incorrect page type
            <span class="hint">(out of <span id="total-count">0</span> URLs)</span>
          </p>
          <button id="download-button" class="btn btn-large" type="button">Download Report</button>
        </section>
      </main>
    </div>
  </body>
</html>
